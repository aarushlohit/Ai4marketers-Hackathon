groups:
  - name: miracle-birds-alerts
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.instance }}"

      # High latency
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency"
          description: "P95 latency is {{ $value }}s for {{ $labels.instance }}"

      # Pod restarts
      - alert: PodRestarting
        expr: increase(kube_pod_container_status_restarts_total[1h]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod restarting frequently"
          description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last hour"

      # High memory usage
      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is at {{ $value | humanizePercentage }} for {{ $labels.container }}"

      # Database connection pool exhaustion
      - alert: DBConnectionPoolExhausted
        expr: db_connection_pool_usage > 0.90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "DB pool at {{ $value | humanizePercentage }} capacity"

      # ML model prediction failure rate
      - alert: MLPredictionFailureRate
        expr: rate(ml_prediction_errors_total[5m]) / rate(ml_predictions_total[5m]) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High ML prediction failure rate"
          description: "{{ $value | humanizePercentage }} of predictions are failing"

      # CRM sync failures
      - alert: CRMSyncFailures
        expr: increase(crm_sync_failures_total[1h]) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "CRM sync failures detected"
          description: "{{ $value }} CRM sync failures in the last hour"
