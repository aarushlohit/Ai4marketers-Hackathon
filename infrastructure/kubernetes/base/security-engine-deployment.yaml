apiVersion: apps/v1
kind: Deployment
metadata:
  name: miracle-birds-security-engine
  labels:
    app: miracle-birds
    component: security-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: miracle-birds
      component: security-engine
  template:
    metadata:
      labels:
        app: miracle-birds
        component: security-engine
    spec:
      containers:
      - name: security-engine
        image: miraclebirds/security-engine:latest
        ports:
        - containerPort: 8004
          name: http
        env:
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: miracle-birds-secrets
              key: redis-url
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 45
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: miracle-birds-security-engine
spec:
  type: ClusterIP
  ports:
  - port: 8004
    targetPort: 8004
    name: http
  selector:
    app: miracle-birds
    component: security-engine
