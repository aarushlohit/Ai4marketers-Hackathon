apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: miracle-birds-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
spec:
  tls:
  - hosts:
    - miraclebirds.ai
    - api.miraclebirds.ai
    secretName: miracle-birds-tls
  rules:
  - host: miraclebirds.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: miracle-birds-frontend
            port:
              number: 3000
  - host: api.miraclebirds.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: miracle-birds-backend
            port:
              number: 8000
