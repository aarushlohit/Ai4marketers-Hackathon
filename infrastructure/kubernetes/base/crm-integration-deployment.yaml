apiVersion: apps/v1
kind: Deployment
metadata:
  name: miracle-birds-crm-integration
  labels:
    app: miracle-birds
    component: crm-integration
spec:
  replicas: 2
  selector:
    matchLabels:
      app: miracle-birds
      component: crm-integration
  template:
    metadata:
      labels:
        app: miracle-birds
        component: crm-integration
    spec:
      containers:
      - name: crm-integration
        image: miraclebirds/crm-integration:latest
        ports:
        - containerPort: 8003
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: miracle-birds-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: miracle-birds-secrets
              key: redis-url
        - name: SALESFORCE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: miracle-birds-crm-secrets
              key: salesforce-client-id
        - name: SALESFORCE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: miracle-birds-crm-secrets
              key: salesforce-client-secret
        - name: HUBSPOT_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: miracle-birds-crm-secrets
              key: hubspot-client-id
        - name: HUBSPOT_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: miracle-birds-crm-secrets
              key: hubspot-client-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: miracle-birds-crm-integration
spec:
  type: ClusterIP
  ports:
  - port: 8003
    targetPort: 8003
    name: http
  selector:
    app: miracle-birds
    component: crm-integration
---
# Celery worker for async CRM sync jobs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miracle-birds-crm-worker
  labels:
    app: miracle-birds
    component: crm-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: miracle-birds
      component: crm-worker
  template:
    metadata:
      labels:
        app: miracle-birds
        component: crm-worker
    spec:
      containers:
      - name: crm-worker
        image: miraclebirds/crm-integration:latest
        command: ["celery", "-A", "app.core.celery_app", "worker",
                  "--loglevel=info", "--concurrency=4",
                  "--queues=crm_sync,webhooks"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: miracle-birds-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: miracle-birds-secrets
              key: redis-url
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: miracle-birds-crm-integration-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: miracle-birds-crm-integration
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
