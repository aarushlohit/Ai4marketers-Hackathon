services:
  # ── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-miracle_birds}
      POSTGRES_USER: ${POSTGRES_USER:-miracle_birds_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miracle_birds_user} -d ${POSTGRES_DB:-miracle_birds}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mb_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-devpassword}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devpassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ──────────────────────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    container_name: mb_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-miracle_birds_user}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-miracle_birds}
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379/0
      AI_ENGINE_URL: http://ai_engine:8001
      ML_ENGINE_URL: http://ml_engine:8002
      CRM_SERVICE_URL: http://crm_integration:8003
      SECURITY_ENGINE_URL: http://security_engine:8004
      WORKFLOW_ENGINE_URL: http://workflow_engine:8003
    ports:
      - "18000:8000"
    volumes:
      - ./apps/backend:/app
      - ./apps/ml-engine:/ml-engine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker ────────────────────────────────────────
  celery_worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    container_name: mb_celery
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-miracle_birds_user}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-miracle_birds}
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379/0
      AI_ENGINE_URL: http://ai_engine:8001
      ML_ENGINE_URL: http://ml_engine:8002
      CRM_SERVICE_URL: http://crm_integration:8003
      SECURITY_ENGINE_URL: http://security_engine:8004
      WORKFLOW_ENGINE_URL: http://workflow_engine:8003
    volumes:
      - ./apps/backend:/app
      - ./apps/ml-engine:/ml-engine
    depends_on:
      - backend
      - redis

  # ── Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    container_name: mb_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:18000
    ports:
      - "13000:3000"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  # ── AI Engine ────────────────────────────────────────────
  ai_engine:
    build:
      context: ./apps/ai-engine
      dockerfile: Dockerfile.dev
    container_name: mb_ai_engine
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-miracle_birds_user}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-miracle_birds}
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379/0
    ports:
      - "28001:8001"
    volumes:
      - ./apps/ai-engine:/app
    depends_on:
      - postgres
      - redis

  # ── ML Engine ────────────────────────────────────────────
  ml_engine:
    build:
      context: ./apps/ml-engine
      dockerfile: Dockerfile.dev
    container_name: mb_ml_engine
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-miracle_birds_user}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-miracle_birds}
    ports:
      - "28002:8002"
    volumes:
      - ./apps/ml-engine:/app
      - ml_models:/app/models/saved
    depends_on:
      - postgres

  # ── CRM Integration ─────────────────────────────────────
  crm_integration:
    build:
      context: ./apps/crm-integration
      dockerfile: Dockerfile.dev
    container_name: mb_crm_integration
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-miracle_birds_user}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-miracle_birds}
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379/0
      CRM_MOCK_MODE: ${CRM_MOCK_MODE:-true}
      MOCK_CRM_PUBLIC_URL: ${MOCK_CRM_PUBLIC_URL:-http://localhost:28900}
      MOCK_CRM_INTERNAL_URL: http://mock_crm_provider:8900
      SALESFORCE_CLIENT_ID: ${SALESFORCE_CLIENT_ID:-}
      SALESFORCE_CLIENT_SECRET: ${SALESFORCE_CLIENT_SECRET:-}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
    ports:
      - "28003:8003"
    volumes:
      - ./apps/crm-integration:/app
    depends_on:
      - postgres
      - redis
      - mock_crm_provider

  # ── Mock CRM Provider ────────────────────────────────────
  mock_crm_provider:
    build:
      context: ./apps/mock-crm-provider
      dockerfile: Dockerfile.dev
    container_name: mb_mock_crm_provider
    restart: unless-stopped
    environment:
      MOCK_CRM_INTERNAL_BASE_URL: http://mock_crm_provider:8900
    ports:
      - "28900:8900"
    volumes:
      - ./apps/mock-crm-provider:/app

  # ── Security Engine ──────────────────────────────────────
  security_engine:
    build:
      context: ./apps/security-engine
      dockerfile: Dockerfile.dev
    container_name: mb_security_engine
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379/0
    ports:
      - "28004:8004"
    volumes:
      - ./apps/security-engine:/app
    depends_on:
      - redis

  # ── Workflow Engine ──────────────────────────────────────
  workflow_engine:
    build:
      context: ./apps/workflow-engine
      dockerfile: Dockerfile.dev
    container_name: mb_workflow_engine
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-miracle_birds_user}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-miracle_birds}
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379/0
    ports:
      - "28005:8003"
    volumes:
      - ./apps/workflow-engine:/app
    depends_on:
      - postgres
      - redis

  # ╔══════════════════════════════════════════════════════════╗
  # ║  PHASE 3 — Enterprise AI Intelligence Platform Services  ║
  # ╚══════════════════════════════════════════════════════════╝

  # ── Agent Service ───────────────────────────────────────────
  agent_service:
    build:
      context: ./apps/agent-service
      dockerfile: Dockerfile.dev
    container_name: mb_agent_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-miracle_birds_user}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-miracle_birds}
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379/0
      MEMORY_SERVICE_URL: http://memory_service:8102
      KNOWLEDGE_SERVICE_URL: http://knowledge_service:8103
      SEARCH_SERVICE_URL: http://search_service:8104
      REASONING_SERVICE_URL: http://reasoning_service:8105
      SIMULATION_SERVICE_URL: http://simulation_service:8106
      EXECUTIVE_SERVICE_URL: http://executive_service:8107
    ports:
      - "28101:8101"
    volumes:
      - ./apps/agent-service:/app
    depends_on:
      - postgres
      - redis

  # ── Memory Service ──────────────────────────────────────────
  memory_service:
    build:
      context: ./apps/memory-service
      dockerfile: Dockerfile.dev
    container_name: mb_memory_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-miracle_birds_user}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-miracle_birds}
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379/0
    ports:
      - "28102:8102"
    volumes:
      - ./apps/memory-service:/app
    depends_on:
      - postgres
      - redis

  # ── Knowledge Service ────────────────────────────────────────
  knowledge_service:
    build:
      context: ./apps/knowledge-service
      dockerfile: Dockerfile.dev
    container_name: mb_knowledge_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-miracle_birds_user}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-miracle_birds}
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379/0
    ports:
      - "28103:8103"
    volumes:
      - ./apps/knowledge-service:/app
    depends_on:
      - postgres
      - redis

  # ── Search Service ───────────────────────────────────────────
  search_service:
    build:
      context: ./apps/search-service
      dockerfile: Dockerfile.dev
    container_name: mb_search_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-miracle_birds_user}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-miracle_birds}
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379/0
    ports:
      - "28104:8104"
    volumes:
      - ./apps/search-service:/app
    depends_on:
      - postgres
      - redis

  # ── Reasoning Service ────────────────────────────────────────
  reasoning_service:
    build:
      context: ./apps/reasoning-service
      dockerfile: Dockerfile.dev
    container_name: mb_reasoning_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-miracle_birds_user}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-miracle_birds}
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379/0
    ports:
      - "28105:8105"
    volumes:
      - ./apps/reasoning-service:/app
    depends_on:
      - postgres
      - redis

  # ── Simulation Service ───────────────────────────────────────
  simulation_service:
    build:
      context: ./apps/simulation-service
      dockerfile: Dockerfile.dev
    container_name: mb_simulation_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-miracle_birds_user}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-miracle_birds}
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379/0
    ports:
      - "28106:8106"
    volumes:
      - ./apps/simulation-service:/app
    depends_on:
      - postgres
      - redis

  # ── Executive Service ────────────────────────────────────────
  executive_service:
    build:
      context: ./apps/executive-service
      dockerfile: Dockerfile.dev
    container_name: mb_executive_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-miracle_birds_user}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-miracle_birds}
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379/0
      AGENT_SERVICE_URL: http://agent_service:8101
      MEMORY_SERVICE_URL: http://memory_service:8102
      KNOWLEDGE_SERVICE_URL: http://knowledge_service:8103
      SEARCH_SERVICE_URL: http://search_service:8104
      REASONING_SERVICE_URL: http://reasoning_service:8105
      SIMULATION_SERVICE_URL: http://simulation_service:8106
    ports:
      - "28107:8107"
    volumes:
      - ./apps/executive-service:/app
    depends_on:
      - postgres
      - redis

  # ── Customer Twin Service ─────────────────────────────────────
  customer_twin_service:
    build:
      context: ./apps/customer-twin-service
      dockerfile: Dockerfile.dev
    container_name: mb_customer_twin_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-miracle_birds_user}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-miracle_birds}
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379/0
    ports:
      - "28108:8108"
    volumes:
      - ./apps/customer-twin-service:/app
    depends_on:
      - postgres
      - redis

  # ── Observability Service ─────────────────────────────────────
  observability_service:
    build:
      context: ./apps/observability-service
      dockerfile: Dockerfile.dev
    container_name: mb_observability_service
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-miracle_birds_user}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-miracle_birds}
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379/0
    ports:
      - "28109:8109"
    volumes:
      - ./apps/observability-service:/app
    depends_on:
      - postgres
      - redis

  # ── MLflow Tracking ──────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: mb_mlflow
    restart: unless-stopped
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  # ── Grafana ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: mb_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana:/etc/grafana/provisioning

  # ── Prometheus ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: mb_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

volumes:
  postgres_data:
  redis_data:
  ml_models:
  grafana_data:
  prometheus_data:
